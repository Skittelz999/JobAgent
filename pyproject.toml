[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-jobagent"
version = "0.1.0"
description = "Local Windows job search assistant"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.12,<3", "tzdata>=2025.2; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
jobagent = "jobagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
