{% extends "base.html" %}{% block content %}<div class="narrow"><p class="eyebrow">FLER KÄLLOR, SAMMA ÖVERSIKT</p><h1>Importera en annons.</h1><p class="muted">Kopiera hela annonstexten från LinkedIn, Indeed eller en annan jobbsida. Samma källa och länk uppdaterar den befintliga annonsen.</p><section class="panel">{% if error %}<p role="alert" class="notice">{{ error }}</p>{% endif %}<form method="post" action="/import"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Källa<input name="source" list="sources" required maxlength="100" value="{{ values.get('source', '') }}" placeholder="linkedin, indeed eller annan källa"><datalist id="sources"><option value="linkedin"><option value="indeed"><option value="platsbanken"></datalist></label><label>Titel<input name="title" required maxlength="500" value="{{ values.get('title', '') }}"></label><div class="filter-grid"><label>Arbetsgivare (valfritt)<input name="employer" value="{{ values.get('employer', '') }}"></label><label>Ort (valfritt)<input name="location" value="{{ values.get('location', '') }}"></label></div><label>Originallänk<input type="url" name="original_url" required maxlength="4000" value="{{ values.get('original_url', '') }}" placeholder="https://..."></label><label>Hela annonstexten<textarea name="description" rows="15" required maxlength="500000">{{ values.get('description', '') }}</textarea></label><button>Spara annons</button></form></section></div>{% endblock %}
